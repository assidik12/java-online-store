# ===================================================================
# Toko Online - Spring Boot Application Configuration
# ===================================================================

# 1. Aplikasi & Port Server
spring.application.name=toko-online
server.port=8080

# 2. Konfigurasi MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/java_toko_online?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Konfigurasi HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# 4. Konfigurasi Jackson JSON Output
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Jakarta

# 5. Konfigurasi Log Level
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.service=DEBUG
logging.level.repository=DEBUG
logging.level.controller=INFO

# 6. Konfigurasi Flyway Migration
spring.flyway.url=jdbc:mysql://localhost:3306/java_toko_online?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.flyway.user=root
spring.flyway.password=
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed