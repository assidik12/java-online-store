# ===================================================================
# Toko Online - Spring Boot Application Configuration
# ===================================================================

# 1. Aplikasi & Port Server
spring.application.name=toko-online
server.port=8080

# 2. Konfigurasi MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/java_toko_online?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. Konfigurasi HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# 4. Konfigurasi Jackson JSON Output
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Jakarta

# 5. Konfigurasi Log Level
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.service=DEBUG
logging.level.repository=DEBUG
logging.level.controller=INFO

# 6. Konfigurasi Flyway Migration
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration,classpath:db/seed

# 7. Konfigurasi JWT
# HS256 secret minimal 32 byte (256 bit) untuk HS256; gunakan base64 256-bit untuk kuat.
app.jwt.secret=ZmFrZS1zZWNyZXQta2V5LWZvci10b2tvLW9ubGluZS1hcHAtbXVzdC1iZS1sb25nLWVub3VnaC0yNTYtYml0
app.jwt.access-token-expiration-ms=3600000
app.jwt.refresh-token-expiration-ms=604800000
app.jwt.issuer=toko-online

# 8. Konfigurasi Security (sengaja blank - credentials via env / vault di production)

# 9. OpenAPI / Swagger UI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.packages-to-scan=toko_online.controller
springdoc.show-actuator=false

# 10. Actuator (healthcheck endpoint untuk Docker / Kubernetes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=REST API untuk Toko Online & POS
info.app.version=1.0.0